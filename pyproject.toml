[project]
name = "intermodality-analysis"
version = "0.1.0"
description = "Script to analyze intermodality trips from MobiSurvStd surveys"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.1",
    "matplotlib>=3.8.2",
    "mobisurvstd>=0.10.0",
    "polars>=1.34.0",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
]

[project.scripts]
main = "intermodality_analysis:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.6.0",
]
